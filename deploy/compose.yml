services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: xhs-server:local
    init: true
    restart: unless-stopped
    env_file:
      - server.env
    environment:
      XHS_SERVER_DATA_ROOT: /data
      XHS_BROWSER_HEADLESS: "1"
      XHS_WEB_SECURE_COOKIE: "1"
      XHS_TRUST_PROXY: "1"
    volumes:
      - server_data:/data
    expose:
      - "8000"
    mem_limit: 6g
    cpus: 3
    pids_limit: 1024
    shm_size: 1gb
    stop_grace_period: 6m
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file:
      - server.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  server_data:
  caddy_data:
  caddy_config:
